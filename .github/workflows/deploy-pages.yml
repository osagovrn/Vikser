name: Deploy to GitHub Pages

# Публикация включается, когда в настройках репозитория задан домен сайта:
# Settings → Secrets and variables → Actions → Variables → SITE_URL = https://ваш-домен.ru
# Без домена сайт публиковать нельзя: GitHub отдаёт проектные сайты из подпапки
# /<репозиторий>/, а сборка рассчитана на работу в корне домена.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.SITE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка статического сайта
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build:static

      - name: Загрузка артефакта
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

  deploy:
    needs: build
    if: vars.SITE_URL != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
