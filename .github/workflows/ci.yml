name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Линт
        run: npm run lint

      - name: Сборка
        run: npm run build

      - name: Сборка статического варианта (GitHub Pages)
        run: npm run build:static

      - name: Проверка артефактов сборки
        run: |
          test -f .vercel/output/config.json
          test -f .vercel/output/functions/__server.func/.vc-config.json
          test -f dist-static/index.html
          test -f dist-static/404.html
          test -f dist-static/sitemap.xml
          echo "Сборка на месте"
